name: Android CI

on:
  push:
    branches:
      - "main"
      - "chatgpt-*"
      - "chatgpt/**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * 0"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Run lint
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Calculate APK SHA-256
        if: success()
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AzadLauncher-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish branch APK
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/chatgpt-') || startsWith(github.ref, 'refs/heads/chatgpt/'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: AzadLauncher-debug-${{ github.sha }}
          path: release

      - name: Publish branch APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="release/app/build/outputs/apk/debug/app-debug.apk"
          SHA="release/app-debug.apk.sha256"

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG="latest"
            TITLE="Latest debug APK"
            PRERELEASE="false"
            LATEST="--latest"
          else
            SAFE_BRANCH="$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')"
            TAG="apk-${SAFE_BRANCH}"
            TITLE="Development APK — ${GITHUB_REF_NAME}"
            PRERELEASE="true"
            LATEST="--latest=false"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SHA" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \\
              --target "$GITHUB_SHA" \\
              --title "$TITLE" \\
              --notes "Automatically built from commit $GITHUB_SHA on branch $GITHUB_REF_NAME." \\
              --prerelease="$PRERELEASE" \\
              $LATEST
          else
            gh release create "$TAG" "$APK" "$SHA" \\
              --repo "$GITHUB_REPOSITORY" \\
              --target "$GITHUB_SHA" \\
              --title "$TITLE" \\
              --notes "Automatically built from commit $GITHUB_SHA on branch $GITHUB_REF_NAME." \\
              --prerelease="$PRERELEASE" \\
              $LATEST
          fi

          echo "APK_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/app-debug.apk.sha256" >> "$GITHUB_STEP_SUMMARY"
